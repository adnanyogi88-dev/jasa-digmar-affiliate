<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <linearGradient id="g15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <pattern id="grid15" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="24" fill="url(#g15)" />
  <rect width="800" height="480" fill="url(#grid15)" />

  <!-- Ambient Glow circles -->
  <circle cx="700" cy="100" r="180" fill="#ffffff" opacity="0.08" />
  <circle cx="100" cy="380" r="140" fill="#000000" opacity="0.15" />

  <!-- Category Badge -->
  <g transform="translate(50, 45)">
    <rect width="180" height="34" rx="17" fill="#0f172a" opacity="0.8" />
    <text x="90" y="22" fill="#f59e0b" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">LIVE COMMERCE</text>
  </g>

  <!-- Right Pill Badge -->
  <g transform="translate(560, 45)">
    <rect width="190" height="34" rx="17" fill="#ffffff" opacity="0.2" />
    <text x="95" y="22" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">INSTANT CLOSING</text>
  </g>

  <!-- Central Title -->
  <text x="50" y="160" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">
    Formula Live Shopping Shopee & TikTok
  </text>
  <text x="50" y="195" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="16" font-weight="500" opacity="0.85">
    Panduan &amp; Studi Kasus Praktis Agensi Digital Marketing DIGMAR
  </text>

  <!-- Dynamic Graphic Card inside SVG -->
  <g transform="translate(50, 230)">
    <rect width="700" height="190" rx="18" fill="#0f172a" opacity="0.45" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />
    
    <!-- Wave / Chart line -->
    <path d="M 30 140 Q 150 40 260 110 T 480 50 T 670 30" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M 30 140 Q 150 40 260 110 T 480 50 T 670 30 L 670 170 L 30 170 Z" fill="url(#g15)" opacity="0.25" />

    <!-- Metric points -->
    <circle cx="260" cy="110" r="6" fill="#ffffff" />
    <circle cx="480" cy="50" r="6" fill="#f59e0b" />
    <circle cx="670" cy="30" r="7" fill="#22c55e" />

    <!-- Metric Label Box -->
    <g transform="translate(30, 25)">
      <rect width="210" height="44" rx="10" fill="#ffffff" opacity="0.15" />
      <text x="15" y="28" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="13" font-weight="800">LIVE STREAMING</text>
    </g>

    <!-- Branding Watermark -->
    <text x="670" y="165" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" opacity="0.7" text-anchor="end">DIGMAR INSIGHTS • ARTIKEL #15</text>
  </g>
</svg>