<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1e40af" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Icon Symbol -->
    <g transform="translate(10, 8)" filter="url(#shadow)">
        <!-- Rounded square badge -->
        <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#primaryGrad)" />
        
        <!-- Modern dynamic growth arrow + D letter shape -->
        <!-- Outer dynamic curve -->
        <path d="M20 18 H34 C43 18 48 24 48 32 C48 40 43 46 34 46 H20 V18 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
        
        <!-- Upward Growth Arrow (Affiliate & Marketing scale) -->
        <path d="M22 44 L34 32 L40 37 L50 22" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <polygon points="50,22 43,22 50,29" fill="#f59e0b" />
        
        <!-- Center glowing node -->
        <circle cx="34" cy="32" r="3.5" fill="#ffffff" />
        <circle cx="40" cy="37" r="3.5" fill="#ffffff" />
    </g>

    <!-- Brand Typography -->
    <g transform="translate(86, 26)">
        <!-- Main Brand Name -->
        <text x="0" y="24" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
            <tspan fill="#0f172a">DIG</tspan><tspan fill="#f59e0b">MAR</tspan>
        </text>
        
        <!-- Tagline / Descriptor -->
        <text x="1" y="42" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#3b82f6" letter-spacing="2">
            DIGITAL MARKETING &amp; AFFILIATE
        </text>
    </g>
</svg>